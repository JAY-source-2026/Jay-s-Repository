<!doctype html><meta charset="utf-8"><style>body{margin:0;background:#101c2a;color:white;font:16px sans-serif}canvas{display:block;width:100vw;height:100vh}#label{position:absolute;top:20px;left:24px;line-height:1.8}</style><div id="label"></div><canvas></canvas><script type="module">
import * as T from '../../assets/js/vendor/three.module.min.js';
import {openingJacket,jacketProfile} from '../../assets/js/installation-jacket.js';
const q=new URLSearchParams(location.search),size=Number(q.get('size')||267),profile=jacketProfile(size),radius=size/2000;
const renderer=new T.WebGLRenderer({canvas:document.querySelector('canvas'),antialias:true});renderer.setSize(innerWidth,innerHeight);renderer.setPixelRatio(1);renderer.setClearColor('#101c2a');renderer.toneMapping=T.ACESFilmicToneMapping;renderer.toneMappingExposure=1.3;
const scene=new T.Scene(),camera=new T.PerspectiveCamera(34,innerWidth/innerHeight,.001,20);
const mat=(color,roughness=.4,metalness=.7)=>new T.MeshStandardMaterial({color,roughness,metalness});
const materials={zinc:mat('#b8d2d9'),jacketZinc:mat('#c7d8db'),bandCore:mat('#171b20',.96,0),steel:mat('#d6e0e4'),jacketFastener:mat('#bda45a')};
scene.add(new T.HemisphereLight(0xf4f8ff,0x40566c,3));
for(const [x,y,z,p]of [[-1,2,3,4],[2,1,-2,3],[2,-2,2,2]]){const l=new T.DirectionalLight(0xffffff,p);l.position.set(x,y,z);scene.add(l);}
const envScene=new T.Scene();envScene.background=new T.Color('#607080');
for(const [x,y,z]of [[-3,3,4],[3,1,-3]]){const m=new T.Mesh(new T.PlaneGeometry(4,7),new T.MeshBasicMaterial({color:new T.Color(3,3,3),side:T.DoubleSide}));m.position.set(x,y,z);m.lookAt(0,0,0);envScene.add(m);}
const gen=new T.PMREMGenerator(renderer),env=gen.fromScene(envScene,.04);scene.environment=env.texture;
const p=openingJacket({T,parent:scene,radius,profile,face:1,x:0,surface:0,start:0,end:6,fixStart:6,fixEnd:10.6,materials,owned:new Set()});
const scale=(radius+profile.layer*profile.layers)*2;
camera.position.set(scale*1.7,scale*.85,scale*2.6);camera.lookAt(0,0,profile.depth*.45);
window.review={seek(t){p.update(t);renderer.render(scene,camera);return p.object.userData;},camera:camera,renderer,scene};
window.review.seek(Number(q.get('t')||6));document.querySelector('#label').textContent=`SFBA-200 · ${profile.nominal}A / ${Number(q.get('t')||6)}s`;
</script>
